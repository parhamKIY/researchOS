[project]
name = "researchos-backend"
version = "0.1.0"
description = "ResearchOS API and background processing"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<8",
  "celery[redis]>=5.4,<6",
  "pypdf[image]>=6.20.1,<7",
  "pdfplumber>=0.11,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL, Redis, and a live worker"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
