<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img" aria-labelledby="title description">
  <title id="title">ResearchOS</title>
  <desc id="description">A highlighted passage in a paper links to a claim and its source page.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0d251f"/>
      <stop offset="1" stop-color="#164236"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#66c498" stop-opacity=".24"/>
      <stop offset="1" stop-color="#66c498" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#b0eacb" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1160" height="330" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1160" height="330" fill="url(#background)"/>
    <ellipse cx="940" cy="144" rx="420" ry="270" fill="url(#glow)"/>
    <rect x="560" width="600" height="330" fill="url(#grid)"/>
    <path d="M0 296H1160" stroke="#b0eacb" stroke-opacity=".15"/>
    <path d="M0 296H120" stroke="#9edbb9" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="1159" height="329" rx="22" fill="none" stroke="#92bca8" stroke-opacity=".45"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="54" width="43" height="43" rx="12" fill="#b0eacb"/>
    <path d="M70 86V65h8a6 6 0 0 1 0 12h-8m8 0 7 9" fill="none" stroke="#153b30" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="80" fill="#b0eacb" font-size="14" font-weight="600" letter-spacing="2.5">RESEARCH WORKSPACE</text>
    <text x="53" y="175" fill="#f4fcf7" font-size="76" font-weight="700" letter-spacing="-3">Research<tspan fill="#b0eacb">OS</tspan></text>
    <text x="57" y="224" fill="#c6dbd1" font-size="25">Evidence-linked paper analysis</text>
    <text x="57" y="273" fill="#a9cfbd" font-size="12" font-weight="600" letter-spacing="1.8">01  UPLOAD</text>
    <path d="M161 269h15m-4-4 4 4-4 4" fill="none" stroke="#8bc8aa" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="273" fill="#a9cfbd" font-size="12" font-weight="600" letter-spacing="1.8">02  ANALYZE</text>
    <path d="M307 269h15m-4-4 4 4-4 4" fill="none" stroke="#8bc8aa" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="338" y="273" fill="#a9cfbd" font-size="12" font-weight="600" letter-spacing="1.8">03  INSPECT</text>

    <rect x="615" y="70" width="231" height="204" rx="15" fill="#091c17" opacity=".37"/>
    <rect x="610" y="63" width="231" height="204" rx="15" fill="#f4faf5"/>
    <path d="M610 108H841" stroke="#d1e0d6"/>
    <rect x="627" y="77" width="34" height="18" rx="5" fill="#dbede2"/>
    <text x="644" y="90" text-anchor="middle" fill="#245844" font-size="10" font-weight="700">PDF</text>
    <text x="673" y="90" fill="#386652" font-size="12" font-weight="600">Original paper</text>
    <path d="M631 131h106m-106 13h181m-181 12h150" stroke="#a3bdb0" stroke-width="4" stroke-linecap="round"/>
    <rect x="624" y="168" width="201" height="27" rx="5" fill="#f3e6ac"/>
    <path d="M632 178h142m-142 8h116" stroke="#8c7432" stroke-width="3" stroke-linecap="round"/>
    <path d="M631 209h168m-168 12h182m-182 12h112" stroke="#bdd0c6" stroke-width="4" stroke-linecap="round"/>
    <text x="812" y="251" text-anchor="end" fill="#386652" font-size="11">p. 4</text>

    <path d="M810 181h44a11 11 0 0 0 11-11v-13a11 11 0 0 1 11-11h18" fill="none" stroke="#e7cd79" stroke-width="2.5"/>
    <circle cx="810" cy="181" r="4" fill="#e7cd79" stroke="#685522" stroke-width="1.5"/>
    <rect x="888" y="121" width="226" height="134" rx="14" fill="#091c17" opacity=".37"/>
    <rect x="883" y="114" width="226" height="134" rx="14" fill="#193e32" stroke="#81b49b"/>
    <rect x="899" y="130" width="87" height="22" rx="6" fill="#b0eacb"/>
    <text x="942.5" y="145" text-anchor="middle" fill="#183930" font-size="10" font-weight="700" letter-spacing=".6">AUTHOR CLAIM</text>
    <path d="M901 170h168m-168 13h133" stroke="#85b8a0" stroke-width="4" stroke-linecap="round"/>
    <path d="M899 197h193" stroke="#608c77" stroke-opacity=".65"/>
    <text x="899" y="225" fill="#f0d993" font-size="13" font-weight="600">Source evidence</text>
    <text x="1092" y="225" text-anchor="end" fill="#b7d6c7" font-size="12">Page 4</text>
  </g>
</svg>
