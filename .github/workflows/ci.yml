name: Foundation checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.2
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen ruff check . ../scripts --config pyproject.toml
        working-directory: backend
      - run: uv run --frozen ruff format --check . ../scripts --config pyproject.toml
        working-directory: backend
      - run: uv run --frozen pytest -m "not integration"
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose --profile test run --build --rm tests
      - name: Same-origin web and API smoke check
        run: |
          curl --fail http://localhost:3000/ > /dev/null
          curl --fail http://localhost:3000/api/v1/health/ready
          curl --fail http://localhost:3000/api/openapi.json > /dev/null
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
